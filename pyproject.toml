[project]
name = "memvault"
dynamic = ["version"]
description = "File-first memory engine: inbox ingestion, hybrid retrieval, weekly reflection"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["memory", "markdown", "vault", "rag", "mcp", "notes", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26,<2.3",
    # The official MCP SDK, pinned to one minor. `memvault mcp` leans on two v2 behaviours —
    # sync tool handlers offloaded to a thread, and return annotations becoming output schemas —
    # that are exactly the sort of thing a point release refines. v2 renamed `FastMCP` to
    # `MCPServer` and removed `mcp.server.fastmcp` with no alias, so a v1 resolution does not
    # degrade, it fails to import. Widen only behind a tested review.
    "mcp>=2.0.0,<2.1",
]

[project.optional-dependencies]
# Semantic recall is an extra, not a core dependency (R12): `fastembed` pulls onnxruntime and a
# ~130MB model download, which is a heavy price for someone who only wants to file and grep their
# own notes. Without it the engine still indexes and still answers — chunks are written with no
# embedding and recall runs keyword-only, saying so in its own output rather than pretending.
semantic = ["fastembed>=0.4"]

[project.urls]
Homepage = "https://github.com/emre6943/memvault"
Repository = "https://github.com/emre6943/memvault"
Issues = "https://github.com/emre6943/memvault/issues"

[project.scripts]
memvault = "memvault.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    # Development installs the extra even though the wheel does not require it: the degraded
    # path has to be reachable in tests by injection, never by whichever packages happen to be
    # missing from the machine running them.
    "fastembed>=0.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/memvault/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/memvault"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/memvault"]

# fastembed ships no type information; it is reached through one lazy import behind the
# Embedder protocol, so the untyped surface stops at that boundary.
[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
